apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring-ricj
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.parcial.local`)
      kind: Rule
      services:
        - name: grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring-ricj
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prometheus.parcial.local`)
      kind: Rule
      services:
        - name: kps-prometheus
          port: 9090
